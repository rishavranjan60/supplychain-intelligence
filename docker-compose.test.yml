services:
  postgres-test:
    image: postgres:16

    environment:
      POSTGRES_DB: supplychain_test
      POSTGRES_USER: supplychain_test
      POSTGRES_PASSWORD: local_test_only

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - ./sql/source_schema/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
      - ./sql/migrations/002_ingestion_state.sql:/docker-entrypoint-initdb.d/002_ingestion_state.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U supplychain_test -d supplychain_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 10